# @majapi/ci-version: 1.2.0
# @majapi/ci-type: static
# Standardized Majapi CI/CD Workflow for Static Web Apps (S3 + CloudFront)
# Automated PR preview deploys, isolated preview paths, automated cleanup, and production deploys.
# Generated by Majapi Cloud (https://majapi-cloud.localhost)

name: Majapi Static Web CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
  workflow_dispatch:
    inputs:
      deploy_production:
        description: "Forçar deploy de produção"
        required: false
        default: false
        type: boolean
      cleanup_preview_pr:
        description: "Número do PR para limpar preview manualmente"
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  DEPLOY_DIR: ${{ vars.STATIC_BUILD_DIR || 'catalog/out' }}
  S3_BUCKET: ${{ vars.CATALOG_BUCKET || vars.STATIC_APP_BUCKET }}
  ROLE_ARN: ${{ vars.CATALOG_DEPLOY_ROLE_ARN || vars.AWS_DEPLOY_ROLE_ARN }}
  DISTRIBUTION_ID: ${{ vars.CATALOG_DISTRIBUTION_ID || vars.CLOUDFRONT_DISTRIBUTION_ID }}
  PUBLIC_URL: ${{ vars.PUBLIC_APP_URL || 'https://ui.majapi.com' }}

jobs:
  # 1. Deploy de Preview em S3 + CloudFront para Pull Requests
  deploy_preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    environment:
      name: preview-pr-${{ github.event.pull_request.number }}
      url: ${{ env.PUBLIC_URL }}/previews/pr-${{ github.event.pull_request.number }}/
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Build do frontend estático
        run: npm run build
      - name: Configurar AWS OIDC
        if: ${{ env.ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Sincronizar preview no S3
        if: ${{ env.ROLE_ARN != '' && env.S3_BUCKET != '' }}
        run: |
          BUILD_DIR="${{ env.DEPLOY_DIR }}"
          if [ ! -d "$BUILD_DIR" ]; then
            if [ -d "out" ]; then BUILD_DIR="out";
            elif [ -d "dist" ]; then BUILD_DIR="dist";
            fi
          fi
          PR_KEY="previews/pr-${{ github.event.pull_request.number }}"
          aws s3 sync "$BUILD_DIR" "s3://${{ env.S3_BUCKET }}/$PR_KEY" --delete --cache-control "public,max-age=60"
      - name: Invalidar CDN para preview
        if: ${{ env.ROLE_ARN != '' && env.DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation --distribution-id "${{ env.DISTRIBUTION_ID }}" --paths "/previews/pr-${{ github.event.pull_request.number }}/*"
      - name: Comentar preview no PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.issue.number;
            const previewUrl = `${process.env.PUBLIC_URL}/previews/pr-${prNumber}/`;
            const commentBody = `### 🚀 Majapi Cloud Preview Deploy (Static Web App)\n\nPreview disponível para este PR:\n🔗 **[${previewUrl}](${previewUrl})**\n\n*Hospedado via S3 + CloudFront com invalidação automática.*`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(c => c.body && c.body.includes('Majapi Cloud Preview Deploy'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody,
              });
            }

  # 2. Limpeza automática de Preview quando o PR é fechado/mergeado
  cleanup_preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Configurar AWS OIDC
        if: ${{ env.ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Remover arquivos de preview no S3
        if: ${{ env.ROLE_ARN != '' && env.S3_BUCKET != '' }}
        run: |
          PR_KEY="previews/pr-${{ github.event.pull_request.number }}"
          aws s3 rm "s3://${{ env.S3_BUCKET }}/$PR_KEY" --recursive
      - name: Invalidar CDN após remoção
        if: ${{ env.ROLE_ARN != '' && env.DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation --distribution-id "${{ env.DISTRIBUTION_ID }}" --paths "/previews/pr-${{ github.event.pull_request.number }}/*"
      - name: Notificar no PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.issue.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `🧹 **Majapi Cloud**: O preview estático deste PR foi desmantelado com sucesso após o fechamento.`,
            });

  # 3. Deploy de Produção (push na branch main ou workflow_dispatch)
  deploy_production:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy_production)
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ env.PUBLIC_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Build de Produção
        run: npm run build
      - name: Configurar AWS OIDC
        if: ${{ env.ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Sincronizar Produção no S3
        if: ${{ env.ROLE_ARN != '' && env.S3_BUCKET != '' }}
        run: |
          BUILD_DIR="${{ env.DEPLOY_DIR }}"
          if [ ! -d "$BUILD_DIR" ]; then
            if [ -d "out" ]; then BUILD_DIR="out";
            elif [ -d "dist" ]; then BUILD_DIR="dist";
            fi
          fi
          aws s3 sync "$BUILD_DIR" "s3://${{ env.S3_BUCKET }}" --delete --exclude "previews/*" --exclude "*.html" --exclude "*.txt" --exclude release.json --cache-control "public,max-age=31536000,immutable"
          cd "$BUILD_DIR"
          for file in $(find . -name "*.html" -o -name "*.txt" -o -name release.json 2>/dev/null | sed 's#^./##'); do
            key="$file"
            case "$file" in
              index.html|*/index.html) ;;
              *.html) key="${file%.html}" ;;
            esac
            type=$(case "$file" in *.html) echo text/html;; *.txt) echo text/plain;; *) echo application/json;; esac)
            aws s3 cp "$file" "s3://${{ env.S3_BUCKET }}/$key" --content-type "$type" --cache-control "no-cache"
          done
      - name: Invalidar CDN
        if: ${{ env.ROLE_ARN != '' && env.DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation --distribution-id "${{ env.DISTRIBUTION_ID }}" --paths "/*"
