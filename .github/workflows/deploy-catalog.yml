name: Deploy catalog
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy-catalog
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.CATALOG_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Upload site
        working-directory: catalog/out
        run: |
          bucket="s3://${{ vars.CATALOG_BUCKET }}"
          aws s3 sync . "$bucket" --delete --exclude "*.html" --exclude "*.txt" --exclude release.json --cache-control "public,max-age=31536000,immutable"
          # HTML/RSC payloads change every deploy; serve /login from login.html.
          for file in $(find . -name "*.html" -o -name "*.txt" -o -name release.json | sed 's#^./##'); do
            key="$file"
            case "$file" in
              index.html|*/index.html) ;;
              *.html) key="${file%.html}" ;;
            esac
            type=$(case "$file" in *.html) echo text/html;; *.txt) echo text/plain;; *) echo application/json;; esac)
            aws s3 cp "$file" "$bucket/$key" --content-type "$type" --cache-control "no-cache"
          done
      - name: Invalidate CDN
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CATALOG_DISTRIBUTION_ID }}" --paths "/*"
