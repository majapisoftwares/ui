name: Deploy catalog
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy-catalog
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.CATALOG_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Upload assets
        run: |
          aws s3 sync dist "s3://${{ vars.CATALOG_BUCKET }}" --delete --exclude index.html --exclude release.json --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/index.html "s3://${{ vars.CATALOG_BUCKET }}/index.html" --cache-control "no-cache"
          aws s3 cp dist/release.json "s3://${{ vars.CATALOG_BUCKET }}/release.json" --cache-control "no-cache"
      - name: Invalidate CDN
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CATALOG_DISTRIBUTION_ID }}" --paths "/index.html" "/" "/release.json"
