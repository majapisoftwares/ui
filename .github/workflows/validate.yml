name: Validate UI library
# Once per change: pull requests, and main after a merge. The checks are
# `npm run verify` (scripts/verify.mjs), the same command run before every push.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/cache/restore@v4
        with:
          path: catalog/.next/cache
          key: next-build-catalog-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: next-build-catalog-${{ hashFiles('package-lock.json') }}-
      - run: npm run verify
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: catalog/.next/cache
          key: next-build-catalog-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
  next-starter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starters/next-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: starters/next-app/package-lock.json
      - run: npm ci
      - uses: actions/cache/restore@v4
        with:
          path: starters/next-app/.next/cache
          key: next-build-starter-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: next-build-starter-${{ hashFiles('package-lock.json') }}-
      - run: npm run verify
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: starters/next-app/.next/cache
          key: next-build-starter-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
