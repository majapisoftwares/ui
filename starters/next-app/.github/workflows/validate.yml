name: Validate app
# Once per change: pull requests, and main after a merge. The checks are
# `npm run verify` (scripts/verify.mjs), the same command run before every push.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify
