name: Validate app
# Once per change: pull requests, and main after a merge. The checks are
# `npm run verify` (scripts/verify.mjs), the same command run before every push.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Turbopack's build cache: pull requests start from main's, and main saves a new one.
      - uses: actions/cache/restore@v4
        with:
          path: .next/cache
          key: next-build-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: next-build-${{ hashFiles('package-lock.json') }}-
      - run: npm run verify
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .next/cache
          key: next-build-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
